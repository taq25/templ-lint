name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o templ-lint .

      # Dogfooding: 実バイナリで testdata を検査し、終了コードまで検証する
      - name: Self-check (safe templates pass)
        run: ./templ-lint -allow-sanitizer sanitize.HTML testdata/safe.templ

      - name: Self-check (dangerous templates fail)
        run: |
          if ./templ-lint -allow-sanitizer sanitize.HTML testdata/dangerous.templ; then
            echo "expected non-zero exit for dangerous.templ" >&2
            exit 1
          fi
